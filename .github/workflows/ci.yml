name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # nightly regression at 02:00 UTC

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API suite
        run: pytest -m api --html=reports/api-report.html --self-contained-html
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run UI suite headless
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
        run: pytest -m ui -n 2 --html=reports/ui-${{ matrix.browser }}.html --self-contained-html
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.browser }}-artifacts
          path: |
            reports/
            screenshots/

  mobile-tests:
    name: Mobile tests (Appium + Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2
          appium --version
      - name: Download ApiDemos sample app
        run: |
          mkdir -p apps
          curl -sSL -o apps/ApiDemos-debug.apk \
            https://github.com/appium/android-apidemos/releases/download/v3.1.0/ApiDemos-debug.apk
          ls -la apps/
      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run mobile suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Appium must start inside this step: ANDROID_HOME and the booted
          # emulator only exist once the action's environment is up.
          script: |
            adb devices
            appium --log appium.log --log-level info &
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:4723/status > /dev/null && break
              echo "waiting for Appium server ($i/30)"; sleep 2
            done
            curl -sf http://127.0.0.1:4723/status || (echo "Appium did not start"; cat appium.log; exit 1)
            pytest -m mobile --html=reports/mobile-report.html --self-contained-html
      - name: Upload mobile report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          path: |
            reports/
            appium.log
