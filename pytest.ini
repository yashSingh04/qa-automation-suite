[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    ui: browser-driven UI tests (Selenium)
    api: HTTP API tests (requests)
    smoke: minimal critical-path checks
    regression: full regression suite
    e2e: end-to-end user journeys
    negative: negative / error-path cases
log_cli = true
log_cli_level = INFO
